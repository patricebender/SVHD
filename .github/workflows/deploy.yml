name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: svhd-1c545
          # Pin the CLI: 15.34.1 added a serviceusage.services.get preflight
          # that the Admin-SDK service account lacks. 15.34.0 deploys fine with
          # the same credential (as cabo-web does).
          firebaseToolsVersion: "15.34.0"

      # Record a GitHub Deployment so the repo's "Deployments" panel links to
      # the live site (action-hosting-deploy itself does not create one).
      - name: Register GitHub deployment
        uses: actions/github-script@v7
        with:
          script: |
            const url = "https://svhd-1c545.web.app/";
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: "production",
              required_contexts: [],
              auto_merge: false,
              transient_environment: false,
              production_environment: true,
              description: "Firebase Hosting",
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: "success",
              environment_url: url,
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: "Deployed to Firebase Hosting",
            });
